# latom Exact-TDDFT simulation configuration
# Seeded from experiment_1 (same helium atom). The ExactTDDFT binary is
# used when mode = exact_tddft; otherwise the TDSE binary is used.

mode = exact_tddft

# Grid (2D xy + 1D x for KS orbital / He+)
grid_nx = 1500
grid_ny = 1500
grid_dx = 0.2
grid_dy = 0.2

# Imaginary-time (ground state)
imag_dt = 0.25
imag_steps = 100

# Real-time (laser propagation)
real_dt = 0.1
real_steps = 2000

# Output cadence
obs_every = 1
wf_every = 200

# Physics
ionization_box = 50
init_type = 3
coulomb_eps = 1.0
absorb_ampl = 50.0

# Laser
laser_freq = 1.556
laser_alpha = 0.1
laser_cycles = 40.0

# Caching: if these files are present in output_dir, skip the imag-time step
load_ground = 0
load_heplus = 0
load_ks_ground = 0

# Optional: separate imag steps for He+ (1D, cheap). 0 reuses imag_steps.
heplus_imag_steps = 0

# I/O
output_dir = .
ground_file = wf_ground.dat
heplus_file = wf_heliumplus.dat
ks_ground_file = ks_ground.dat
wf_file = wf_laser.dat
ks_orbital_file = kohnshamorbital_laser.dat
realpot_file = realpot_laser.dat
obser_file = obser_laser.dat
obser_imag_file = obserimag_laser.dat
